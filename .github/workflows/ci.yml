name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: '1.15'
            otp: '25'
          - elixir: '1.20'
            otp: '29'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}

    - name: Restore dependencies cache
      uses: actions/cache@v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Compile
      run: mix compile --warnings-as-errors

    - name: Run tests
      run: mix test

    - name: Check formatting
      run: mix format --check-formatted
      if: matrix.elixir == '1.20' && matrix.otp == '29'

    - name: Run Credo
      run: mix credo --strict
      if: matrix.elixir == '1.20' && matrix.otp == '29'

    - name: Smoke benchmark scripts
      if: matrix.elixir == '1.20' && matrix.otp == '29'
      run: |
        NB_BENCH_SMOKE=1 mix run bench/quick_bench.exs
        NB_BENCH_SMOKE=1 mix run bench/serialization_bench.exs

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20'
        otp-version: '29'

    - name: Restore dependencies cache
      uses: actions/cache@v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-29-1.20-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-29-1.20-

    - name: Install dependencies
      run: mix deps.get

    - name: Run coverage
      run: mix coveralls.json
      env:
        MIX_ENV: test

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./cover/excoveralls.json
        flags: nb_serializer
        fail_ci_if_error: false
